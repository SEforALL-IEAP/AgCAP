name: agcapenv
channels:
  - conda-forge
  - defaults
dependencies:
  # Core Python runtime and conda-managed packages (exact versions, cross-platform)
  - python=3.13.12
  - scipy=1.17.1
  - geemap=0.37.1
  - earthengine-api=1.7.13
  - ipykernel=7.2.0
  - ipywidgets=8.1.8
  - tk=8.6.15
  - pip=25.3
  - pip:
      # Platform app
      - dash==3.3.0
      - dash-bootstrap-components==2.0.4
      - plotly==6.7.0
      - flask==3.1.3
      - werkzeug==3.1.8
      - gunicorn==23.0.0
      # Geospatial
      - geopandas==1.1.2
      - fiona==1.10.1
      - pyproj==3.7.2
      - shapely==2.1.2
      - rasterio==1.5.0
      - rasterstats==0.21.0
      - pyogrio==0.12.1
      # Data
      - pandas==2.3.3
      - numpy==2.4.0
      - pyarrow==23.0.1
      - scikit-learn==1.6.1
      # Utilities
      - openpyxl==3.1.5
      - python-dotenv==1.2.1
      - pytz==2025.2
      - tzdata==2025.3
